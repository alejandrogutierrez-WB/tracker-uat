# ============================================================
# keep-alive.yml — mantiene despierta la base de datos
# El plan gratuito de Supabase pausa el proyecto si pasa ~1 semana
# sin uso. Este trabajo corre una vez al día y hace una llamada
# liviana (toma la foto diaria del avance), con la clave pública.
# OJO: GitHub desactiva los trabajos programados si el repositorio
# pasa 60 días sin cambios. Si eso ocurre: pestaña Actions ->
# "Keep alive" -> "Enable workflow" (ver COMO-MANTENER.txt).
# ============================================================
name: Keep alive

on:
  schedule:
    - cron: "17 9 * * *"   # todos los días, 09:17 UTC
  workflow_dispatch:        # permite correrlo a mano desde Actions

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a la base (foto diaria)
        env:
          # Públicos por diseño: son los mismos que están en js/config.js
          SUPABASE_URL: https://zsxjiltjfxinmsyrcecs.supabase.co
          SUPABASE_KEY: sb_publishable_CVdyCR9qFOZ0t8FA7MFIRQ_OKslSQ0Q
        run: |
          curl --fail --silent --show-error --max-time 60 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/take_snapshot" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo "Base de datos activa."
